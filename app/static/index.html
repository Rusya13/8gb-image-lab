<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 GB Image Lab</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --dim:#98a0b3; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; gap:16px; align-items:stretch; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .meter { flex:1 1 200px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:190px; }
  .meter .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
  .meter .value { font-size:30px; font-weight:650; font-variant-numeric:tabular-nums; line-height:1.15; }
  .meter .value small { font-size:15px; color:var(--dim); font-weight:500; }
  .bar { height:8px; background:#0b0d11; border-radius:4px; margin-top:6px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--ok); transition:width .25s; }
  main { display:grid; grid-template-columns: minmax(300px, 400px) 1fr; gap:16px; padding:16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  label { display:block; color:var(--dim); font-size:12px; margin:10px 0 4px; }
  select, textarea, input[type=number] { width:100%; background:#0b0d11; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea { min-height:120px; resize:vertical; }
  .row { display:flex; gap:10px; } .row > * { flex:1; }
  button { background:var(--accent); color:#06121f; border:0; border-radius:8px; padding:11px 14px; font:inherit; font-weight:650; cursor:pointer; width:100%; margin-top:14px; }
  button:disabled { opacity:.45; cursor:default; }
  button.plain { background:transparent; color:var(--dim); border:1px solid var(--line); margin-top:8px; font-weight:500; }
  #note { color:var(--dim); font-size:12.5px; margin-top:8px; }
  #stage { min-height:420px; display:flex; align-items:center; justify-content:center; background:#0b0d11; border-radius:8px; overflow:hidden; }
  #stage img { max-width:100%; max-height:72vh; display:block; }
  #state { font-size:18px; margin:0 0 10px; font-variant-numeric:tabular-nums; }
  #error { color:var(--bad); margin-top:8px; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); } th { color:var(--dim); font-weight:500; }
  .wrap { overflow-x:auto; }
  #ref { max-width:100%; max-height:140px; border-radius:6px; display:none; margin-top:8px; }
  footer { color:var(--dim); font-size:12px; padding:0 16px 18px; }
</style>
</head>
<body>
<header>
  <div class="meter"><div class="label">Graphics memory (whole card)</div>
    <div class="value"><span id="vram">–</span> <small>/ <span id="vramTotal">–</span> GB</small></div><div class="bar"><i id="vramBar"></i></div></div>
  <div class="meter"><div class="label">Spilled into system RAM</div>
    <div class="value"><span id="shared">–</span> <small>GB shared</small></div><div class="bar"><i id="sharedBar"></i></div></div>
  <div class="meter"><div class="label">System RAM in use</div>
    <div class="value"><span id="ram">–</span> <small>/ <span id="ramTotal">–</span> GB</small></div><div class="bar"><i id="ramBar"></i></div></div>
  <div class="meter"><div class="label">This picture</div>
    <div class="value"><span id="clock">0.0</span> <small>s</small></div><div class="bar"><i id="stepBar" style="background:var(--accent)"></i></div></div>
</header>
<main>
  <section class="panel">
    <label for="model">Model</label>
    <select id="model"></select>
    <div id="note"></div>
    <label for="prompt">Prompt</label>
    <textarea id="prompt">A red fox standing in fresh snow at sunrise, breath visible in the cold air, pine forest behind, photograph</textarea>
    <div class="row">
      <div><label for="size">Size</label><select id="size"></select></div>
      <div><label for="seed">Seed</label><input id="seed" type="number" value="1" min="0"></div>
    </div>
    <label for="file">Picture to edit (optional)</label>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
    <img id="ref" alt="picture to edit">
    <button id="clear" class="plain" style="display:none">Remove the picture (draw from text only)</button>
    <button id="go">Generate</button>
    <button id="unload" class="plain">Unload the model (free the card)</button>
    <div id="error"></div>
  </section>
  <section class="panel">
    <p id="state">Ready.</p>
    <div id="stage"><span style="color:var(--dim)">Your picture appears here.</span></div>
    <div class="wrap"><table>
      <thead><tr><th>Model</th><th>Size</th><th>Steps</th><th>Seconds</th><th>Card peak</th><th>Spilled</th><th>RAM peak</th><th>Load</th></tr></thead>
      <tbody id="runs"></tbody>
    </table></div>
  </section>
</main>
<footer id="foot"></footer>
<script>
const $ = id => document.getElementById(id);
const gb = mb => (mb / 1024).toFixed(1);
let models = [], refData = null, lastFile = null;

async function info() {
  const r = await (await fetch('/api/info')).json();
  models = r.models;
  $('model').innerHTML = models.map(m => `<option value="${m.key}">${m.title}</option>`).join('');
  $('size').innerHTML = r.sizes.map(s => `<option value="${s[0]}x${s[1]}"${s[0] === 1024 && s[1] === 1024 ? ' selected' : ''}>${s[0]} x ${s[1]}</option>`).join('');
  const v = r.versions;
  $('foot').textContent = `${v.gpu}, driver ${v.driver} · torch ${v.torch} · diffusers ${v.diffusers} · transformers ${v.transformers} · bitsandbytes ${v.bitsandbytes}`;
  note();
}
function note() {
  const m = models.find(x => x.key === $('model').value);
  if (!m) return;
  $('note').textContent = `${m.steps} steps. Licence: ${m.licence}. First use downloads about ${m.download_gb} GB and converts it once.` + (m.can_edit ? '' : ' This model cannot edit pictures.');
}
function bar(el, frac, warnAt, badAt) {
  el.style.width = Math.min(100, 100 * frac) + '%';
  el.style.background = frac >= badAt ? 'var(--bad)' : frac >= warnAt ? 'var(--warn)' : 'var(--ok)';
}
let sharedBase = null;
async function tick() {
  try {
    const s = await (await fetch('/api/status')).json();
    $('vram').textContent = gb(s.vram_mb); $('vramTotal').textContent = gb(s.vram_total_mb);
    bar($('vramBar'), s.vram_mb / s.vram_total_mb, 0.85, 0.96);
    if (s.shared_mb !== null) {
      if (sharedBase === null || (!s.running && s.shared_mb < sharedBase)) sharedBase = s.shared_mb;
      const grown = Math.max(0, s.shared_mb - sharedBase);
      $('shared').textContent = gb(s.shared_mb);
      bar($('sharedBar'), grown / 4096, 0.05, 0.12);
    } else { $('shared').textContent = 'n/a'; }
    $('ram').textContent = gb(s.ram_mb); $('ramTotal').textContent = gb(s.ram_total_mb);
    bar($('ramBar'), s.ram_mb / s.ram_total_mb, 0.85, 0.93);
    const p = s.progress;
    if (s.running) {
      $('clock').textContent = s.elapsed.toFixed(1);
      $('stepBar').style.width = (p.steps ? 100 * p.step / p.steps : 0) + '%';
      $('state').textContent = (s.what || p.state) + (p.state === 'drawing' && p.steps ? `: step ${p.step} of ${p.steps}` : p.state === 'reading the prompt' ? ': reading the prompt' : '') + ' …';
    } else if (s.last && s.last.file !== lastFile) {
      lastFile = s.last.file;
      $('clock').textContent = s.last.seconds.toFixed(1);
      $('stepBar').style.width = '100%';
      $('stage').innerHTML = `<img src="/outputs/${s.last.file}" alt="result">`;
      $('state').textContent = `Done in ${s.last.seconds.toFixed(1)} s. Card peak ${gb(s.last.vram_peak_mb)} GB, RAM peak ${gb(s.last.ram_peak_mb)} GB.`;
    } else if (!s.last) { $('state').textContent = s.loaded ? 'Ready.' : 'Ready. No model in memory yet.'; }
    $('go').disabled = s.running; $('unload').disabled = s.running;
    $('error').textContent = s.error || '';
    $('runs').innerHTML = s.history.slice().reverse().map(h => `<tr><td>${h.title}${h.edit ? ' (edit)' : ''}</td><td>${h.width}x${h.height}</td><td>${h.steps}</td><td>${h.seconds.toFixed(1)}</td><td>${gb(h.vram_peak_mb)} GB</td><td>${h.shared_growth_mb === null ? 'n/a' : (h.shared_growth_mb / 1024).toFixed(2) + ' GB'}</td><td>${gb(h.ram_peak_mb)} GB</td><td>${h.load_s ? h.load_s.toFixed(0) + ' s' : '–'}</td></tr>`).join('');
  } catch (e) { $('state').textContent = 'The server is not answering.'; }
}
$('model').onchange = note;
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { refData = r.result; $('ref').src = refData; $('ref').style.display = 'block'; $('clear').style.display = 'block'; $('go').textContent = 'Edit this picture'; };
  r.readAsDataURL(f);
};
$('clear').onclick = () => { refData = null; $('file').value = ''; $('ref').style.display = 'none'; $('clear').style.display = 'none'; $('go').textContent = 'Generate'; };
$('go').onclick = async () => {
  const [w, h] = $('size').value.split('x').map(Number);
  const body = { model: $('model').value, prompt: $('prompt').value, width: w, height: h, seed: Number($('seed').value) || 0 };
  if (refData) body.image = refData;
  $('go').disabled = true;
  const r = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) $('error').textContent = (await r.json()).error;
};
$('unload').onclick = () => fetch('/api/unload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
info(); tick(); setInterval(tick, 400);
</script>
</body>
</html>
